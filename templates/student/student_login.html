{% extends "index.html" %}
{% block title %}Student Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card p-4 shadow" style="width: 400px; border-radius: 12px;">
    <h3 class="text-center mb-3 text-success">Student Login</h3>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Login</button>
    </form>

    <div class="text-center mt-3">
      <p class="mb-2">Not registered yet?</p>
      <a href="/register/student" class="btn btn-outline-success w-100">Register as Student</a>
    </div>
  </div>
</div>
{% endblock %}
