<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
     rel="stylesheet"
     integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
     crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-dark bg-info">
        <div class="container-fluid">
            <a class="navbar-brand mb-0 h1" href="/">Placement Portal</span>
        </div>
    </nav>
    

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- card -->

                <div class="card shadow-lg">
                    <div class="card-header bg-info text-white text-center">
                        <h4>Company Registration</h4>
                    </div>

                    <div class="card-body">
                       {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                             {% if success %}
                            <div class="alert alert-success">{{ success }}</div>
                        {% endif %}



                        <form action="/register/company" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="company_name" class="form-label">Company Legal Name</label>
                                <input type="text" class="form-control" id="company_name" name="company_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="hr_contact" class="form-label">HR Contact Person</label>
                                <input type="text" class="form-control" id="hr_contact" name="hr_contact" required>
                            </div>
                            <div class="mb-3">
                                <label for="website" class="form-label">Website</label>
                                <input type="url" class "form-control" id=website name=website required>
                            </div>
                            <div class = "mb-3">
                                <label for = "password",class = "form-label">Password</label>
                                <input type = "password",class = "form-control",id = "password",name = "password",required >
                            </div>

                            <button type = "submit",class = "btn btn-primary">Register Company</button>

                        </form>




                    </div>
                </div>
            </div>

        </div>



    </div>




    
</body>
</html>
