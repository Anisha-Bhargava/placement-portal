<div class="card shadow-sm mb-5">
    <div class="card-header bg-dark text-white">
        Pending Placement Drives
    </div>
    <div class="card-body table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Sr. No</th>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Deadline</th>
                    <th>Approval Action</th>
                </tr>
            </thead>
            <tbody>
                {% for drive in pending_drives %}
                <tr>
                    <td class="fw-bold">{{ loop.index }}</td>
                    <td>{{ drive.job_title }}</td>
                    <td>{{ drive.company.company_name }}</td>
                    <td>{{ drive.application_deadline.strftime('%d-%m-%Y') }}</td>
                    <td class="d-flex gap-2">
                        <form method="POST" action="{{ url_for('approve_drive', id=drive.id) }}">
                            <button type="submit" class="btn btn-success btn-sm">Approve</button>
                        </form>

                        <form method="POST" action="{{ url_for('reject_drive', id=drive.id) }}">
                            <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted">No pending placement drives.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
