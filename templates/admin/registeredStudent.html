<div class="card shadow-sm mb-5">
    <div class="card-header bg-dark text-white">
        Registered Students
    </div>

    <div class="card-body table-responsive">

        <table class="table table-sm table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th class="text-start">Name</th>
                    <th class="text-center">Roll No</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for data in all_students %}
                <tr>
                    <td class="fw-bold text-start">{{ data.name }}</td>
                    <td class="text-center">{{ data.roll_number }}</td>
                    <td class="text-center">
                        <form action="{{ url_for('toggle_blacklist', id=data.id) }}" method="POST" class="d-inline">
                            <button type="submit"
                                class="btn btn-sm px-3 {% if data.blacklist %}btn-info{% else %}btn-danger{% endif %}"
                                style="min-width: 120px;">
                                {% if data.blacklist %}
                                Remove
                                {% else %}
                                Blacklist
                                {% endif %}
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
