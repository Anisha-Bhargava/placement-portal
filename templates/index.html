<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
 
    <title>{% block title %}Document{% endblock %}</title>
  </head>
  <body >
    {% include "navbar.html" %}

    <div class="container mt-5 main-content">
       
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="alert-container">
        {% for category, message in messages %}
        <div
          class="alert alert-{{ category }} alert-dismissible fade show"
          role="alert"
        >
          {{ message }}
          <button
            type="button"
            class="close"
            data-dismiss="alert"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}
      <!-- Content -->
      {% block content %}{% endblock %}
    </div>
      <!-- Navigation buttons -->
      <div class="navigation-buttons d-flex justify-content-center align-items-center position-fixed fixed-bottom w-100 mt-2 mb-2">
        <button onclick="window.history.back();" class="btn btn-dark">Go Backward</button>
        <button onclick="window.history.forward();" class="btn btn-warning ms-4">Go Forward</button>
    </div>
 
    <!-- Move scripts here -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- <script src="{{ url_for('static', filename='js/script.js') }}"></script> -->
     <!-- Bootstrap JS Bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Only load relevant script based on page -->
    {% block scripts %}{% endblock %}
  </body>
</html>
