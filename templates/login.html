{% extends "index.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="container mt-5">
  <div class="text-center mb-4">
    <h2>Welcome to CareerBridge</h2>
    <p>Select your role to login</p>
  </div>

  <div class="row justify-content-center">
    <!-- Admin Card -->
    <div class="col-md-3 mb-4">
      <div class="card shadow-lg text-center p-4">
        <div class="text-primary mb-3">
          <i class="bi bi-person-badge-fill" style="font-size:40px;"></i>
        </div>
        <h5>Admin Login</h5>
        <a href="/login/admin" class="btn btn-primary mt-3 w-100">Login as Admin</a>
      </div>
    </div>

    <!-- Student Card -->
    <div class="col-md-3 mb-4">
      <div class="card shadow-lg text-center p-4">
        <div class="text-success mb-3">
          <i class="bi bi-mortarboard-fill" style="font-size:40px;"></i>
        </div>
        <h5>Student Login</h5>
        <a href="/login/student" class="btn btn-success mt-3 w-100">Login as Student</a>
      </div>
    </div>

    <!-- Company Card -->
    <div class="col-md-3 mb-4">
      <div class="card shadow-lg text-center p-4">
        <div class="text-warning mb-3">
          <i class="bi bi-buildings-fill" style="font-size:40px;"></i>
        </div>
        <h5>Company Login</h5>
        <a href="/login/company" class="btn btn-warning mt-3 w-100">Login as Company</a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
