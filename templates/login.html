{% extends "index.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<!-- Overlay with background -->
<div class="overlay d-flex align-items-center justify-content-center">
  <div class="container text-center text-white">
    <h1 class="mb-4">Welcome to CareerBridge</h1>
    <p class="mb-5">Smart Campus Placement Portal<br>Select your role to login</p>

    <div class="row justify-content-center">
      <!-- Admin Card -->
      <div class="col-md-3 mb-4">
        <div class="card shadow-lg text-center p-4 login-card">
          <div class="text-primary mb-3">
            <i class="bi bi-person-badge-fill" style="font-size:40px;"></i>
          </div>
          <h5>Admin Login</h5>
          <a href="{{ url_for('admin_login') }}" class="btn btn-primary mt-3 w-100">Login as Admin</a>
        </div>
      </div>

      <!-- Student Card -->
      <div class="col-md-3 mb-4">
        <div class="card shadow-lg text-center p-4 login-card">
          <div class="text-success mb-3">
            <i class="bi bi-mortarboard-fill" style="font-size:40px;"></i>
          </div>
          <h5>Student Login</h5>
          <a href="{{ url_for('student_login') }}" class="btn btn-success mt-3 w-100">Login as Student</a>
        </div>
      </div>

      <!-- Company Card -->
      <div class="col-md-3 mb-4">
        <div class="card shadow-lg text-center p-4 login-card">
          <div class="text-warning mb-3">
            <i class="bi bi-buildings-fill" style="font-size:40px;"></i>
          </div>
          <h5>Company Login</h5>
          <a href="{{ url_for('company_login') }}" class="btn btn-warning mt-3 w-100">Login as Company</a>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
